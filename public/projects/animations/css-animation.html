<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spinny spin</title>
    <style>
        #dark-blue-circle {
            opacity: 0;
            transform-origin: center;
            animation: 5s  linear rotate-right;
            animation-iteration-count: infinite;
        }

        #blue-circle {
            transform-origin: center;
            animation: 5s linear rotate-right;
            animation-iteration-count: infinite;
        }

        #green-circle {
            transform-origin: center;
            animation: 5s linear rotate-left;
            animation-iteration-count: infinite;
        }

        #yellow-circle {
            transform-origin: center;
            animation: 5s linear rotate-right;
            animation-iteration-count: infinite;
        }

        #red-circle {
            transform-origin: center;
            animation: 5s linear rotate-left;
            animation-iteration-count: infinite;
        }

        #hide {
            opacity: 0;
        }

        @keyframes rotate-left {
            0% {
                rotate: -360deg;
            }
            100% {
                rotate: 0deg;
            }
        }

        @keyframes rotate-right {
            0% {
                rotate: 360deg;
            }
            100% {
                rotate: 0deg;
            }
        }
        /* Added: make the logo fill the frame on the portfolio page */
        body { margin: 0; }
        body { overflow: hidden; }
        svg { display: block; width: 100%; height: 100vh; }
    </style>
</head>
